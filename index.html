<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Record — Music Player</title>
  <meta name="description" content="Stream and showcase original music — Agents, All My Peoples Sovereignty, My Peoples Sovereignty, Destined to Depart, and more." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" /></noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Warm amber-ink palette */
      --bg:          oklch(97.5% 0.008 72);
      --surface:     oklch(93%   0.012 70);
      --surface-hi:  oklch(88%   0.016 68);
      --border:      oklch(82%   0.016 70);
      --border-lt:   oklch(90%   0.010 70);

      --text:        oklch(16%   0.018 55);
      --text-2:      oklch(38%   0.014 58);
      --text-3:      oklch(56%   0.012 62);

      /* Player panel — deep ink */
      --ink:         oklch(14%   0.022 52);
      --ink-2:       oklch(20%   0.020 52);
      --ink-3:       oklch(28%   0.018 55);
      --ink-text:    oklch(92%   0.010 72);
      --ink-muted:   oklch(65%   0.012 68);

      /* Accent — warm amber */
      --amber:       oklch(68%   0.17  58);
      --amber-lt:    oklch(80%   0.13  62);
      --amber-dk:    oklch(55%   0.16  52);

      --white:       oklch(99%   0.003 80);

      /* Easing */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    @media (min-width: 720px) {
      .app {
        grid-template-columns: 340px 1fr;
        gap: 0 3.5rem;
        padding: 0 2.5rem 5rem;
      }
    }

    /* ── Header ───────────────────────────────────────── */
    .site-header {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
      gap: 1rem;
    }

    .site-title {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
    }

    .site-title em {
      font-style: italic;
      font-weight: 200;
      font-size: 0.85em;
      color: var(--amber-dk);
      display: block;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
    }

    .track-count {
      font-size: 0.75rem;
      color: var(--text-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Player Panel ──────────────────────────────────── */
    .player-panel {
      position: sticky;
      top: 2rem;
      align-self: start;
      background: var(--ink);
      color: var(--ink-text);
      border-radius: 4px;
      padding: 2.25rem;
      margin-bottom: 3rem;
    }

    .now-playing-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--amber);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    /* ── Vinyl art ────────────────────────────────────── */
    .track-art {
      width: 100%;
      aspect-ratio: 1;
      background: var(--ink-2);
      border-radius: 2px;
      margin-bottom: 1.75rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Subtle textured background */
    .track-art::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-conic-gradient(
          from 0deg at 50% 50%,
          transparent 0deg,
          oklch(18% 0.02 52) 0.3deg,
          transparent 0.6deg
        );
      opacity: 0.6;
    }

    .vinyl {
      position: relative;
      width: 72%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%,
        oklch(22% 0.015 55) 0%,
        oklch(10% 0.01 50) 38%,
        oklch(14% 0.012 52) 39%,
        oklch(10% 0.01 50) 40%,
        oklch(13% 0.012 52) 60%,
        oklch(9%  0.008 50) 61%,
        oklch(13% 0.012 52) 62%,
        oklch(9%  0.008 50) 100%
      );
      box-shadow:
        0 0 0 1px oklch(30% 0.02 55),
        0 12px 40px oklch(5% 0.01 50 / 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: vinyl-spin 3s linear infinite;
      animation-play-state: paused;
    }

    @keyframes vinyl-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .vinyl-label {
      width: 32%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%,
        var(--amber) 0%,
        var(--amber-dk) 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .vinyl-label::after {
      content: '';
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--ink-2);
      position: absolute;
    }

    /* ── Track info ────────────────────────────────────── */
    .player-track-title {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.3rem;
      color: var(--ink-text);
    }

    .player-track-num {
      font-size: 0.72rem;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
      letter-spacing: 0.04em;
    }

    /* ── Progress bar ─────────────────────────────────── */
    .progress-wrap {
      margin-bottom: 0.5rem;
      position: relative;
    }

    /* Custom-rendered fill track */
    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--ink-3);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: var(--amber);
      border-radius: 2px;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .progress-bar {
      position: absolute;
      inset: -6px 0;
      width: 100%;
      height: 100%;
      padding: 6px 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      z-index: 2;
    }

    .progress-bar::-webkit-slider-runnable-track {
      height: 3px;
      background: transparent;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--white);
      margin-top: -5px;
      cursor: pointer;
      box-shadow: 0 1px 4px oklch(5% 0.01 50 / 0.5);
      transition: transform 0.1s var(--ease-out-expo);
    }

    .progress-bar:hover::-webkit-slider-thumb,
    .progress-bar:active::-webkit-slider-thumb {
      transform: scale(1.25);
    }

    .progress-bar::-moz-range-track {
      height: 3px;
      background: transparent;
    }

    .progress-bar::-moz-range-thumb {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--white);
      border: none;
      cursor: pointer;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
    }

    /* ── Controls ─────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .btn-ctrl {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      transition: color 0.15s, transform 0.1s var(--ease-out-expo);
      line-height: 1;
      border-radius: 50%;
    }

    .btn-ctrl:hover {
      color: var(--ink-text);
      transform: scale(1.1);
    }

    .btn-ctrl:active { transform: scale(0.94); }

    .btn-play {
      width: 54px; height: 54px;
      border-radius: 50%;
      background: var(--amber);
      color: var(--ink) !important;
      flex-shrink: 0;
      transition: background 0.18s, transform 0.12s var(--ease-out-expo), box-shadow 0.18s;
      box-shadow: 0 4px 20px oklch(68% 0.17 58 / 0.3);
    }

    .btn-play:hover {
      background: var(--amber-lt);
      transform: scale(1.07);
      box-shadow: 0 6px 28px oklch(68% 0.17 58 / 0.45);
    }

    .btn-play:active { transform: scale(0.95); }

    /* ── Volume ──────────────────────────────────────── */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .vol-icon { color: var(--ink-muted); flex-shrink: 0; }

    .volume-bar {
      flex: 1;
      height: 3px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: var(--ink-3);
      border-radius: 2px;
    }

    .volume-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--amber-lt);
      margin-top: -4px;
      cursor: pointer;
      transition: transform 0.1s var(--ease-out-expo);
    }

    .volume-bar:hover::-webkit-slider-thumb {
      transform: scale(1.2);
    }

    .volume-bar::-moz-range-thumb {
      width: 11px; height: 11px;
      border-radius: 50%;
      background: var(--amber-lt);
      border: none;
    }

    /* ── Track List ──────────────────────────────────── */
    .track-list {
      padding-top: 0.25rem;
    }

    .track-list-header {
      display: grid;
      grid-template-columns: 2.5rem 1fr 4.5rem;
      gap: 0 0.75rem;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-3);
      padding: 0 0.75rem 0.9rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .track-item {
      display: grid;
      grid-template-columns: 2.5rem 1fr 4.5rem;
      gap: 0 0.75rem;
      align-items: center;
      padding: 0.85rem 0.75rem;
      border-radius: 3px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      position: relative;
      /* Staggered entrance */
      opacity: 0;
      transform: translateY(10px);
      animation: row-enter 400ms var(--ease-out-expo) forwards;
    }

    @keyframes row-enter {
      to { opacity: 1; transform: translateY(0); }
    }

    .track-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--amber);
      border-radius: 2px;
      transform: scaleY(0);
      transition: transform 0.2s var(--ease-out-expo);
    }

    .track-item:hover {
      background: var(--surface);
    }

    .track-item:hover::before,
    .track-item.active::before {
      transform: scaleY(1);
    }

    .track-item.active {
      background: var(--surface);
      border-bottom-color: var(--border-lt);
    }

    .track-num {
      font-size: 0.78rem;
      color: var(--text-3);
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 400;
      transition: color 0.15s;
    }

    .track-item.active .track-num { color: var(--amber-dk); }
    .track-item:hover .track-num  { color: var(--text-2); }

    .track-info { min-width: 0; }

    .track-name {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 0.975rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      color: var(--text);
      transition: color 0.15s;
    }

    .track-item.active .track-name { color: var(--amber-dk); }

    .track-file {
      font-size: 0.7rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .track-duration {
      font-size: 0.75rem;
      color: var(--text-3);
      text-align: right;
      font-variant-numeric: tabular-nums;
      transition: color 0.15s;
    }

    .track-item.active .track-duration { color: var(--text-2); }

    /* ── Playing indicator ─────────────────────────────── */
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      justify-content: center;
    }

    .bars span {
      display: block;
      width: 3px;
      background: var(--amber);
      border-radius: 1px;
      animation: bar-bounce 0.55s ease-in-out infinite alternate;
    }

    .bars span:nth-child(1) { height: 5px;  animation-delay: 0s; }
    .bars span:nth-child(2) { height: 11px; animation-delay: 0.12s; }
    .bars span:nth-child(3) { height: 7px;  animation-delay: 0.25s; }

    @keyframes bar-bounce {
      from { transform: scaleY(0.35); }
      to   { transform: scaleY(1); }
    }

    .bars.paused span { animation-play-state: paused; }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 719px) {
      .player-panel {
        position: static;
        border-radius: 3px;
      }
    }

    /* ── Reduced motion ────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .vinyl { animation: none !important; }
      .track-item {
        animation: none;
        opacity: 1;
        transform: none;
      }
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Screen-reader utility ─────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
<div class="app">

  <header class="site-header">
    <div>
      <h1 class="site-title">
        The Record
        <em>My Music</em>
      </h1>
    </div>
    <div class="header-meta">
      <div class="track-count" id="track-count"></div>
    </div>
  </header>

  <!-- Player -->
  <aside class="player-panel">
    <div class="now-playing-label">Now Playing</div>

    <div class="track-art">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label"></div>
      </div>
    </div>

    <div class="player-track-title" id="player-title">Select a track</div>
    <div class="player-track-num" id="player-num">—</div>

    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
        <label for="progress" class="sr-only">Playback position</label>
        <input type="range" class="progress-bar" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Playback position" />
      </div>
    </div>
    <div class="time-row" aria-live="off">
      <span id="time-cur" aria-label="Current time">0:00</span>
      <span id="time-dur" aria-label="Total duration">0:00</span>
    </div>

    <div class="controls">
      <button class="btn-ctrl" id="btn-prev" title="Previous" aria-label="Previous track">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn-ctrl btn-play" id="btn-play" title="Play / Pause" aria-label="Play or pause" aria-pressed="false">
        <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn-ctrl" id="btn-next" title="Next" aria-label="Next track">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="volume-row">
      <svg class="vol-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <label for="volume" class="sr-only">Volume</label>
      <input type="range" class="volume-bar" id="volume" min="0" max="1" step="0.02" value="0.8" aria-label="Volume" />
    </div>
  </aside>

  <!-- Track List -->
  <main class="track-list" aria-label="Track listing">
    <div class="track-list-header" role="row" aria-hidden="true">
      <span>#</span>
      <span>Title</span>
      <span style="text-align:right">Duration</span>
    </div>
    <div id="track-rows" role="list"></div>
  </main>

</div>

<script>
  const TRACKS = [
    { file: "Agents.mp3",                             title: "Destined to Depart (Main)" },
    { file: "Agents(1).mp3",                          title: "Destined to Depart (Take 2)" },
    { file: "Agents(2).mp3",                          title: "Destined to Depart (Raw)" },
    { file: "All My Peoples Sovereignty.mp3",         title: "The Truth (Sovereign King)" },
    { file: "All My Peoples Sovereignty(1).mp3",      title: "Sovereignty (Dismantle the Booth)" },
    { file: "My Peoples Sovereignty.mp3",             title: "All My People Sovereign" },
    { file: "My Peoples Sovereignty(1).mp3",          title: "Sovereignty (Boom Mix)" },
    { file: "Destined to Depart the.mp3",             title: "Destined to Depart" },
    { file: "the truth you can handle the truth.mp3", title: "The Truth (Can't Handle It)" },
  ];

  // State
  let currentIdx = 0;
  let isPlaying  = false;
  const audio    = new Audio();
  audio.volume   = 0.8;

  // DOM refs
  const playerTitle  = document.getElementById('player-title');
  const playerNum    = document.getElementById('player-num');
  const btnPlay      = document.getElementById('btn-play');
  const iconPlay     = document.getElementById('icon-play');
  const iconPause    = document.getElementById('icon-pause');
  const progressEl   = document.getElementById('progress');
  const progressFill = document.getElementById('progress-fill');
  const timeCur      = document.getElementById('time-cur');
  const timeDur      = document.getElementById('time-dur');
  const volume       = document.getElementById('volume');
  const trackRows    = document.getElementById('track-rows');
  const trackCount   = document.getElementById('track-count');
  const vinyl        = document.getElementById('vinyl');

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    const m   = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  // Build track rows with staggered delay
  trackCount.textContent = `${TRACKS.length} Track${TRACKS.length !== 1 ? 's' : ''}`;

  TRACKS.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-item';
    row.dataset.idx = i;
    row.setAttribute('role', 'listitem');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `${t.title}, track ${i + 1}`);
    row.style.animationDelay = `${i * 45}ms`;
    row.innerHTML = `
      <div class="track-num" data-num="${i + 1}">${i + 1}</div>
      <div class="track-info">
        <div class="track-name">${t.title}</div>
        <div class="track-file" aria-hidden="true">${t.file}</div>
      </div>
      <div class="track-duration" data-idx="${i}" aria-label="Duration">—</div>
    `;
    row.addEventListener('keydown', e => {
      if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); row.click(); }
    });
    row.addEventListener('click', () => {
      if (currentIdx === i && isPlaying) {
        pauseAudio();
      } else if (currentIdx === i) {
        playAudio();
      } else {
        loadTrack(i, true);
      }
    });
    trackRows.appendChild(row);

    // Pre-load duration
    const tmp = new Audio();
    tmp.preload = 'metadata';
    tmp.src = encodeURIComponent(t.file).replace(/%20/g, ' ');
    tmp.addEventListener('loadedmetadata', () => {
      const el = document.querySelector(`.track-duration[data-idx="${i}"]`);
      if (el) el.textContent = fmt(tmp.duration);
    });
  });

  function getRows() { return document.querySelectorAll('.track-item'); }

  function setActiveRow(idx) {
    getRows().forEach((r, i) => {
      r.classList.toggle('active', i === idx);
      const numEl = r.querySelector('.track-num');
      if (i === idx) {
        numEl.innerHTML = `<div class="bars${isPlaying ? '' : ' paused'}">
          <span></span><span></span><span></span>
        </div>`;
      } else {
        numEl.textContent = i + 1;
      }
    });
  }

  function setVinylSpinning(on) {
    vinyl.style.animationPlayState = on ? 'running' : 'paused';
  }

  function loadTrack(idx, andPlay = false) {
    currentIdx = idx;
    const t = TRACKS[idx];
    audio.src = t.file;
    audio.load();
    playerTitle.textContent = t.title;
    playerNum.textContent   = `Track ${idx + 1} of ${TRACKS.length}`;
    progressEl.value        = 0;
    progressFill.style.width = '0%';
    timeCur.textContent     = '0:00';
    timeDur.textContent     = '0:00';
    setActiveRow(idx);
    if (andPlay) playAudio();
  }

  function playAudio() {
    audio.play().then(() => {
      isPlaying = true;
      iconPlay.style.display  = 'none';
      iconPause.style.display = '';
      btnPlay.setAttribute('aria-pressed', 'true');
      btnPlay.setAttribute('aria-label', 'Pause');
      setVinylSpinning(true);
      setActiveRow(currentIdx);
    }).catch(() => {});
  }

  function pauseAudio() {
    audio.pause();
    isPlaying = false;
    iconPlay.style.display  = '';
    iconPause.style.display = 'none';
    btnPlay.setAttribute('aria-pressed', 'false');
    btnPlay.setAttribute('aria-label', 'Play');
    setVinylSpinning(false);
    setActiveRow(currentIdx);
  }

  btnPlay.addEventListener('click', () => {
    if (!audio.src) { loadTrack(0, true); return; }
    isPlaying ? pauseAudio() : playAudio();
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack((currentIdx - 1 + TRACKS.length) % TRACKS.length, isPlaying);
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    loadTrack((currentIdx + 1) % TRACKS.length, isPlaying);
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressEl.value         = pct;
    progressFill.style.width = pct + '%';
    timeCur.textContent      = fmt(audio.currentTime);
  });

  audio.addEventListener('loadedmetadata', () => {
    timeDur.textContent      = fmt(audio.duration);
    progressEl.value         = 0;
    progressFill.style.width = '0%';
  });

  audio.addEventListener('ended', () => {
    loadTrack((currentIdx + 1) % TRACKS.length, true);
  });

  progressEl.addEventListener('input', () => {
    if (audio.duration) {
      audio.currentTime        = (progressEl.value / 100) * audio.duration;
      progressFill.style.width = progressEl.value + '%';
    }
  });

  volume.addEventListener('input', () => { audio.volume = volume.value; });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')      { e.preventDefault(); btnPlay.click(); }
    if (e.code === 'ArrowRight') document.getElementById('btn-next').click();
    if (e.code === 'ArrowLeft')  document.getElementById('btn-prev').click();
  });

  // Init
  setVinylSpinning(false);
  loadTrack(0, false);
</script>
</body>
</html>
